<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Route 属性逐项选择 eager 和 lazy</title>
  <desc id="desc">Routecraft 可分别将 Component、loader 和 action 等属性设为静态导入或动态 lazy 导入。path、index、id、children 和 middleware 保持静态路由定义可见；文件不存在则不产生属性。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63758c"/></marker>
    <style>
      .title{font:700 23px system-ui,sans-serif;fill:#172b4d}
      .label{font:700 15px system-ui,sans-serif;fill:#172b4d}
      .small{font:13px system-ui,sans-serif;fill:#42526e}
      .code{font:13px ui-monospace,monospace;fill:#263750}
      .box{stroke-width:1.5;rx:12}
      .flow{stroke:#63758c;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="420" rx="22" fill="#f6f8fb"/>
  <text x="35" y="48" class="title">每个实现属性独立选择；匹配结构保持静态</text>
  <rect x="45" y="105" width="280" height="78" class="box" fill="#e9efff" stroke="#8da8f0"/>
  <text x="68" y="138" class="label">page.tsx → Component</text>
  <text x="68" y="164" class="small">lazy: true → 动态 import</text>
  <rect x="45" y="202" width="280" height="78" class="box" fill="#e7f6ef" stroke="#75c69a"/>
  <text x="68" y="235" class="label">loader.ts → loader</text>
  <text x="68" y="261" class="small">lazy: false → 静态模块 import</text>
  <rect x="45" y="299" width="280" height="78" class="box" fill="#f1eaff" stroke="#b89be3"/>
  <text x="68" y="332" class="label">action.ts → action</text>
  <text x="68" y="358" class="small">lazy: true → 动态 import</text>
  <rect x="417" y="146" width="280" height="190" class="box" fill="#fff2d8" stroke="#e8bd65"/>
  <text x="445" y="181" class="label">同一个 route object</text>
  <text x="445" y="214" class="code">path / index / id</text>
  <text x="445" y="242" class="code">loader: eager loader</text>
  <text x="445" y="270" class="code">lazy: { Component, action }</text>
  <text x="445" y="308" class="small">不存在的属性不会被补空值</text>
  <path d="M325 144C365 144 375 196 409 203" class="flow"/>
  <path d="M325 241H409" class="flow"/>
  <path d="M325 337C365 337 375 280 409 274" class="flow"/>
  <rect x="793" y="105" width="282" height="78" class="box" fill="#ffffff" stroke="#9aa8b7"/>
  <text x="817" y="138" class="label">路径匹配需要立即可见</text>
  <text x="817" y="164" class="small">path · index · id · children</text>
  <rect x="793" y="202" width="282" height="78" class="box" fill="#ffffff" stroke="#9aa8b7"/>
  <text x="817" y="235" class="label">middleware 始终静态导入</text>
  <text x="817" y="261" class="small">不受 route.config lazy 字段控制</text>
  <rect x="793" y="299" width="282" height="78" class="box" fill="#ffffff" stroke="#9aa8b7"/>
  <text x="817" y="332" class="label">React Router 执行 route.lazy</text>
  <text x="817" y="358" class="small">Routecraft 只生成对象与 import 函数</text>
  <path d="M697 241H785" class="flow"/>
</svg>
