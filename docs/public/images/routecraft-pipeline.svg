<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
  <title id="title">Routecraft 系统生成链路</title>
  <desc id="desc">Vite 配置和目录文件经过 Routecraft 扫描、解析、验证和路由中间表示，分别生成路由虚拟模块、类型声明和 DevTools 快照；React Router 负责消费并运行路由对象。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#63758c"/>
    </marker>
    <style>
      .title{font:700 23px system-ui,sans-serif;fill:#172b4d}
      .label{font:700 16px system-ui,sans-serif;fill:#172b4d}
      .small{font:13px system-ui,sans-serif;fill:#42526e}
      .tiny{font:12px system-ui,sans-serif;fill:#52637a}
      .box{stroke-width:1.5;rx:14}
      .flow{stroke:#63758c;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="510" rx="22" fill="#f6f8fb"/>
  <text x="36" y="48" class="title">一次扫描 · 三类产物 · 明确运行边界</text>
  <rect x="34" y="112" width="180" height="114" class="box" fill="#e9efff" stroke="#8da8f0"/>
  <text x="56" y="148" class="label">项目输入</text>
  <text x="56" y="176" class="small">Vite 配置</text>
  <text x="56" y="198" class="small">routes/ 文件树</text>
  <rect x="270" y="112" width="220" height="114" class="box" fill="#e7f6ef" stroke="#75c69a"/>
  <text x="292" y="148" class="label">Routecraft 核心</text>
  <text x="292" y="176" class="small">扫描 · 语法解析</text>
  <text x="292" y="198" class="small">导出校验 · 诊断</text>
  <rect x="546" y="112" width="190" height="114" class="box" fill="#fff2d8" stroke="#e8bd65"/>
  <text x="566" y="148" class="label">Route IR</text>
  <text x="566" y="176" class="small">节点 / 来源 / 属性</text>
  <text x="566" y="198" class="small">eager/lazy / 诊断</text>
  <path d="M214 169H264" class="flow"/>
  <path d="M490 169H540" class="flow"/>
  <rect x="812" y="78" width="270" height="92" class="box" fill="#e9efff" stroke="#8da8f0"/>
  <text x="834" y="112" class="label">Vite 虚拟模块</text>
  <text x="834" y="139" class="small">virtual:routecraft/routes</text>
  <text x="834" y="157" class="tiny">RouteObject[] 源码</text>
  <rect x="812" y="195" width="270" height="92" class="box" fill="#f1eaff" stroke="#b89be3"/>
  <text x="834" y="229" class="label">真实声明文件</text>
  <text x="834" y="256" class="small">typed-router.d.ts</text>
  <text x="834" y="274" class="tiny">RouteId / RoutePath / ParamsFor</text>
  <rect x="812" y="312" width="270" height="92" class="box" fill="#e7f6ef" stroke="#75c69a"/>
  <text x="834" y="346" class="label">DevTools 快照</text>
  <text x="834" y="373" class="small">只读路由元数据与诊断</text>
  <text x="834" y="391" class="tiny">仅 devTools: true 的开发期</text>
  <path d="M736 148C768 148 774 125 804 125" class="flow"/>
  <path d="M736 169H804" class="flow"/>
  <path d="M736 190C768 190 774 358 804 358" class="flow"/>
  <rect x="270" y="318" width="466" height="86" class="box" fill="#ffffff" stroke="#9aa8b7"/>
  <text x="292" y="352" class="label">React Router Data Mode</text>
  <text x="292" y="380" class="small">createBrowserRouter(routeObjects) → 匹配、导航、数据调用与渲染</text>
  <path d="M947 170V310" class="flow"/>
  <text x="962" y="300" class="tiny">应用导入并交给 Router</text>
  <path d="M806 166C782 254 760 318 742 352" class="flow"/>
  <text x="36" y="466" class="small">Routecraft 生成路由定义；React Router 执行路由；Vite 提供构建和开发期模块机制。</text>
</svg>
